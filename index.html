<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VLS • Class 9 Biology: Tissues in Action</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Dribbble Style Dropdown */
        .dribbble-dropdown-trigger {
            border: 2px solid #2563eb;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 4px 14px -2px rgba(37, 99, 235, 0.15);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dribbble-dropdown-trigger:hover {
            border-color: #1d4ed8;
            box-shadow: 0 6px 20px -2px rgba(37, 99, 235, 0.25);
            transform: translateY(-1px);
        }
        .dribbble-dropdown-menu {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 16px 40px -6px rgba(15, 23, 42, 0.18);
        }

        /* Glassmorphic Panels */
        .sim-stage-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
        }

        /* Precision Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #ffffff;
            border: 2.5px solid #2563eb;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="flex flex-col h-full p-2.5 sm:p-3.5 gap-2.5 max-w-7xl mx-auto w-full">

    <!-- TOP HEADER WITH DRIBBLE DROPDOWN NAVIGATION -->
    <header class="flex items-center justify-between gap-3 shrink-0 z-30">
        <!-- Brand Title -->
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black shadow-sm shrink-0">
                <i class="fa-solid fa-microscope text-base"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-extrabold text-slate-900 leading-tight">
                    NCERT Class 9 • <span class="text-blue-600 font-bold">Chapter 3: Tissues in Action</span>
                </h1>
                <p class="text-[10px] text-slate-500 font-medium">Virtual Lab Simulator (VLS) • Interactive Experiments</p>
            </div>
        </div>

        <!-- Dribbble-Style Dropdown Menu -->
        <div class="relative w-full max-w-xs sm:max-w-md">
            <button id="dropdown-trigger" onclick="vls.toggleDropdown()" type="button" class="dribbble-dropdown-trigger w-full px-3.5 py-2 flex items-center justify-between cursor-pointer focus:outline-none">
                <div class="flex items-center gap-2 min-w-0">
                    <span id="active-mod-badge" class="px-2 py-0.5 rounded-md bg-blue-50 text-blue-700 font-bold text-[10px] mono shrink-0 border border-blue-200">
                        M01
                    </span>
                    <span id="active-mod-title" class="text-xs sm:text-sm font-extrabold text-slate-800 truncate">
                        Onion Root Apical Meristem
                    </span>
                </div>
                <div class="flex items-center gap-1.5 shrink-0 ml-2">
                    <i id="dropdown-arrow" class="fa-solid fa-chevron-down text-blue-600 text-xs transition-transform duration-200"></i>
                </div>
            </button>

            <!-- Dropdown Menu List -->
            <div id="dropdown-menu" class="dribbble-dropdown-menu absolute right-0 top-full mt-2 w-full sm:w-[420px] max-h-[70vh] overflow-y-auto p-2 hidden z-50 animate-in fade-in zoom-in-95 duration-150">
                <div class="px-2 py-1.5 border-b border-slate-100 flex items-center gap-2 mb-1">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
                    <input type="text" id="sim-search" placeholder="Search 18 simulations..." oninput="vls.filterMenu(this.value)" class="w-full text-xs font-medium text-slate-700 placeholder-slate-400 focus:outline-none bg-transparent">
                </div>
                <div id="sim-list-container" class="space-y-0.5">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- LARGE SIMULATION STAGE -->
    <main class="sim-stage-card flex-1 relative flex flex-col min-h-0 overflow-hidden">
        <!-- Floating HUD Header inside Canvas -->
        <div class="absolute top-3 left-3 z-10 bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm flex items-center gap-2 pointer-events-none">
            <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
            <span id="hud-sim-title" class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">
                M01: Onion Root Apical Meristem
            </span>
            <span id="hud-sim-tag" class="text-[10px] mono font-bold px-1.5 py-0.2 rounded bg-slate-100 text-slate-600">
                Day 1 of 7
            </span>
        </div>

        <!-- Canvas Zoom Controls Overlay -->
        <div class="absolute top-3 right-3 z-10 bg-white/95 backdrop-blur-md p-1 rounded-xl border border-slate-200 shadow-sm flex items-center gap-1">
            <button onclick="vls.zoomOut()" title="Zoom Out" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs transition cursor-pointer">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span id="zoom-indicator" class="mono text-[11px] font-bold px-1.5 text-slate-700">100%</span>
            <button onclick="vls.zoomIn()" title="Zoom In" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs transition cursor-pointer">
                <i class="fa-solid fa-plus"></i>
            </button>
            <button onclick="vls.resetZoom()" title="Reset Zoom" class="w-7 h-7 rounded-lg hover:bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-[10px] transition cursor-pointer border-l border-slate-200 ml-0.5">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>

        <!-- The Interactive Canvas -->
        <canvas id="sim-canvas" class="w-full h-full block flex-1 cursor-grab active:cursor-grabbing"></canvas>
    </main>

    <!-- UNIFIED BOTTOM CONTROLS BAR (Only required controls per experiment) -->
    <footer class="sim-stage-card p-2.5 sm:p-3 shrink-0 flex flex-col md:flex-row items-center justify-between gap-3 z-20">
        <!-- Global Playback / Reset Controls -->
        <div class="flex items-center gap-2 w-full md:w-auto justify-between md:justify-start">
            <button id="btn-play-pause" onclick="vls.togglePlay()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs shadow-sm flex items-center gap-1.5 transition cursor-pointer shrink-0">
                <i id="play-icon" class="fa-solid fa-play"></i>
                <span id="play-text">Play</span>
            </button>
            <button onclick="vls.resetSim()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-xs flex items-center gap-1.5 transition cursor-pointer shrink-0">
                <i class="fa-solid fa-rotate-left"></i>
                <span>Reset</span>
            </button>
            <div id="sim-status-text" class="text-xs font-semibold text-slate-600 px-2 truncate hidden sm:block">
                Interactive stage active
            </div>
        </div>

        <!-- Dynamic Experiment-Specific Controls -->
        <div id="dynamic-controls-container" class="flex items-center gap-2.5 w-full md:w-auto flex-wrap justify-end">
            <!-- Injected dynamically per simulation -->
        </div>
    </footer>

    <!-- MAIN SIMULATION ENGINE JAVASCRIPT -->
    <script>
        const SIMULATIONS = [
            { id: 'M01', name: 'Onion Root Apical Meristem', cat: 'Plant Tissues', tag: 'Day 1–7 Timeline' },
            { id: 'M02', name: 'Meristem Locator', cat: 'Plant Tissues', tag: 'Apical • Lateral • Intercalary' },
            { id: 'M03', name: 'Tree Rings and Annual Growth', cat: 'Plant Tissues', tag: 'Annual Cambium Rings' },
            { id: 'M04', name: 'Grass and Hedge Regrowth', cat: 'Plant Tissues', tag: 'Intercalary Regeneration' },
            { id: 'M05', name: 'Plant Tissue Microscope', cat: 'Plant Tissues', tag: '40x • 100x • 400x Focus' },
            { id: 'M06', name: 'Xylem and Phloem Transport', cat: 'Plant Tissues', tag: 'Water & Sugar Translocation' },
            { id: 'M07', name: 'Plant Epidermal Tissue', cat: 'Plant Tissues', tag: 'Stomata Guard Cells' },
            { id: 'M08', name: 'Epithelial Tissue', cat: 'Animal Tissues', tag: 'Squamous • Cuboidal • Columnar' },
            { id: 'M09', name: 'Blood Components', cat: 'Animal Tissues', tag: 'RBCs • WBCs • Platelets • Plasma' },
            { id: 'M10', name: 'Connective Tissue', cat: 'Animal Tissues', tag: 'Areolar • Adipose • Bone • Cartilage' },
            { id: 'M11', name: 'Muscle Tissue Comparison', cat: 'Animal Tissues', tag: 'Striated • Smooth • Cardiac' },
            { id: 'M12', name: 'Neuron and Signal Pathway', cat: 'Animal Tissues', tag: 'Saltatory Action Potential' },
            { id: 'M13', name: 'Muscle-Tendon-Bone Movement', cat: 'Biomechanics', tag: 'Class-3 Elbow Lever' },
            { id: 'M14', name: 'Joint Movement Lab', cat: 'Biomechanics', tag: 'Ball & Socket • Hinge • Pivot' },
            { id: 'M15', name: 'Skeleton and Breathing', cat: 'Biomechanics', tag: 'Ribcage Inhalation / Exhalation' },
            { id: 'M16', name: 'Body Weight and Movement', cat: 'Biomechanics', tag: 'Center of Mass & Stability' },
            { id: 'M17', name: 'Carrot Tissue Culture', cat: 'Biotechnology', tag: 'Callus & Totipotent Embryoids' },
            { id: 'M18', name: 'Crown Gall Experiment', cat: 'Biotechnology', tag: 'Agrobacterium Tumor Induction' }
        ];

        class VirtualLabSimulator {
            constructor() {
                this.canvas = document.getElementById('sim-canvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.currentModule = 'M01';
                this.isPlaying = false;
                this.zoomLevel = 1.0;
                this.panX = 0;
                this.panY = 0;
                this.isPanning = false;
                this.lastMouseX = 0;
                this.lastMouseY = 0;
                
                // M01 Onion root state
                this.m01_day = 1;
                this.m01_isCut = false;
                this.m01_showCaliper = false;
                this.m01_showStain = false;
                this.m01_rootA = [1.0, 1.6, 2.2, 2.9, 3.6, 4.3, 5.0];
                this.m01_rootB = [1.0, 1.6, 2.1, 2.1, 2.1, 2.1, 2.1];
                
                // M02 Meristem Locator state
                this.m02_zone = 'shoot_tip';
                
                // M03 Tree Rings state
                this.m03_years = 6;
                
                // M04 Grass Regrowth state
                this.m04_mowed = false;
                this.m04_regrowth = 0;
                
                // M05 Microscope state
                this.m05_mag = 100;
                this.m05_focus = 50;
                this.m05_stain = 'safranin';
                
                // M06 Vascular Transport state
                this.m06_flowRate = 5;
                
                // M07 Epidermal Stomata state
                this.m07_turgor = 80;
                
                // M08 Epithelial state
                this.m08_type = 'squamous';
                
                // M09 Blood state
                this.m09_flowSpeed = 5;
                this.m09_centrifuged = false;
                
                // M10 Connective state
                this.m10_type = 'areolar';
                
                // M11 Muscle state
                this.m11_type = 'skeletal';
                this.m11_bpm = 72;
                
                // M12 Neuron state
                this.m12_impulse = -100;
                this.m12_myelinated = true;
                
                // M13 Elbow Lever state
                this.m13_angle = 90;
                this.m13_load = 2;
                
                // M14 Joint Lab state
                this.m14_type = 'ball_socket';
                this.m14_angle = 45;
                
                // M15 Breathing state
                this.m15_inhale = 50;
                
                // M16 Body Weight state
                this.m16_tilt = 0;
                
                // M17 Carrot Tissue Culture state
                this.m17_stage = 2;
                
                // M18 Crown Gall state
                this.m18_infected = true;
                this.m18_day = 14;
                
                this.animTime = 0;
                this.particles = [];
                
                this.initDOM();
                this.bindEvents();
                this.handleResize();
                this.renderDropdownOptions();
                this.loadModule('M01');
                
                requestAnimationFrame((t) => this.loop(t));
            }

            initDOM() {
                this.dropdownTrigger = document.getElementById('dropdown-trigger');
                this.dropdownMenu = document.getElementById('dropdown-menu');
                this.dropdownArrow = document.getElementById('dropdown-arrow');
                this.activeModBadge = document.getElementById('active-mod-badge');
                this.activeModTitle = document.getElementById('active-mod-title');
                this.hudSimTitle = document.getElementById('hud-sim-title');
                this.hudSimTag = document.getElementById('hud-sim-tag');
                this.zoomIndicator = document.getElementById('zoom-indicator');
                this.playIcon = document.getElementById('play-icon');
                this.playText = document.getElementById('play-text');
                this.simStatusText = document.getElementById('sim-status-text');
                this.controlsContainer = document.getElementById('dynamic-controls-container');
            }

            bindEvents() {
                window.addEventListener('resize', () => this.handleResize());
                document.addEventListener('click', (e) => {
                    if (!this.dropdownTrigger.contains(e.target) && !this.dropdownMenu.contains(e.target)) {
                        this.closeDropdown();
                    }
                });

                // Canvas Pan & Drag interaction
                this.canvas.addEventListener('mousedown', (e) => {
                    this.isPanning = true;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                });
                window.addEventListener('mousemove', (e) => {
                    if (this.isPanning) {
                        const dx = e.clientX - this.lastMouseX;
                        const dy = e.clientY - this.lastMouseY;
                        this.panX += dx;
                        this.panY += dy;
                        this.lastMouseX = e.clientX;
                        this.lastMouseY = e.clientY;
                    }
                });
                window.addEventListener('mouseup', () => { this.isPanning = false; });

                // Wheel zoom
                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (e.deltaY < 0) this.zoomIn();
                    else this.zoomOut();
                }, { passive: false });
            }

            handleResize() {
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width * window.devicePixelRatio;
                this.canvas.height = rect.height * window.devicePixelRatio;
                this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                this.canvas.style.width = `${rect.width}px`;
                this.canvas.style.height = `${rect.height}px`;
            }

            // Dribbble Dropdown Methods
            toggleDropdown() {
                const isHidden = this.dropdownMenu.classList.contains('hidden');
                if (isHidden) this.openDropdown();
                else this.closeDropdown();
            }

            openDropdown() {
                this.dropdownMenu.classList.remove('hidden');
                this.dropdownArrow.style.transform = 'rotate(180deg)';
                const search = document.getElementById('sim-search');
                if (search) { search.value = ''; search.focus(); this.filterMenu(''); }
            }

            closeDropdown() {
                this.dropdownMenu.classList.add('hidden');
                this.dropdownArrow.style.transform = 'rotate(0deg)';
            }

            renderDropdownOptions(filter = '') {
                const container = document.getElementById('sim-list-container');
                if (!container) return;
                
                const f = filter.toLowerCase().trim();
                const matched = SIMULATIONS.filter(s => s.id.toLowerCase().includes(f) || s.name.toLowerCase().includes(f) || s.cat.toLowerCase().includes(f));
                
                let html = '';
                let currentCat = '';
                
                matched.forEach(sim => {
                    if (sim.cat !== currentCat) {
                        currentCat = sim.cat;
                        html += `<div class="text-[9px] font-extrabold uppercase tracking-wider text-slate-400 px-2 py-1 mt-1">${currentCat}</div>`;
                    }
                    const isSelected = sim.id === this.currentModule;
                    html += `
                        <button onclick="vls.selectModule('${sim.id}')" type="button" class="w-full text-left px-2.5 py-2 rounded-xl transition flex items-center justify-between cursor-pointer ${isSelected ? 'bg-blue-50 border border-blue-200 text-blue-900 font-bold' : 'hover:bg-slate-50 text-slate-700 font-medium'}">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="mono text-[10px] px-1.5 py-0.5 rounded ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'} font-bold">
                                    ${sim.id}
                                </span>
                                <span class="text-xs truncate">${sim.name}</span>
                            </div>
                            <span class="text-[10px] text-slate-400 font-mono hidden sm:inline">${sim.tag}</span>
                        </button>
                    `;
                });
                
                if (matched.length === 0) {
                    html = `<div class="text-xs text-slate-400 text-center py-4">No matching simulations</div>`;
                }
                
                container.innerHTML = html;
            }

            filterMenu(query) {
                this.renderDropdownOptions(query);
            }

            selectModule(id) {
                this.loadModule(id);
                this.closeDropdown();
            }

            loadModule(id) {
                this.currentModule = id;
                const sim = SIMULATIONS.find(s => s.id === id) || SIMULATIONS[0];
                
                this.activeModBadge.innerText = sim.id;
                this.activeModTitle.innerText = sim.name;
                this.hudSimTitle.innerText = `${sim.id}: ${sim.name}`;
                
                this.resetZoom();
                this.resetSim();
                this.renderControls();
                this.renderDropdownOptions();
            }

            // Genuine Canvas Zoom In / Out Handlers
            zoomIn() {
                this.zoomLevel = Math.min(2.5, +(this.zoomLevel + 0.25).toFixed(2));
                this.updateZoomDisplay();
            }

            zoomOut() {
                this.zoomLevel = Math.max(0.5, +(this.zoomLevel - 0.25).toFixed(2));
                this.updateZoomDisplay();
            }

            resetZoom() {
                this.zoomLevel = 1.0;
                this.panX = 0;
                this.panY = 0;
                this.updateZoomDisplay();
            }

            updateZoomDisplay() {
                if (this.zoomIndicator) {
                    this.zoomIndicator.innerText = `${Math.round(this.zoomLevel * 100)}%`;
                }
            }

            // Play / Pause / Reset Handlers
            togglePlay() {
                this.isPlaying = !this.isPlaying;
                this.playIcon.className = this.isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
                this.playText.innerText = this.isPlaying ? "Pause" : "Play";
            }

            resetSim() {
                this.isPlaying = false;
                this.playIcon.className = "fa-solid fa-play";
                this.playText.innerText = "Play";
                this.particles = [];
                
                // Reset specific module variables
                this.m01_day = 1;
                this.m01_isCut = false;
                this.m03_years = 6;
                this.m04_mowed = false;
                this.m04_regrowth = 0;
                this.m12_impulse = -100;
                this.m13_angle = 90;
                this.m14_angle = 45;
                this.m15_inhale = 50;
                
                this.renderControls();
            }

            // Dynamic Controls Renderer
            renderControls() {
                const c = this.controlsContainer;
                if (!c) return;
                
                let html = '';
                
                switch(this.currentModule) {
                    case 'M01':
                        this.hudSimTag.innerText = `Day ${this.m01_day} of 7`;
                        html = `
                            <div class="flex items-center gap-2">
                                <label class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                    <i class="fa-regular fa-calendar text-blue-600"></i> Day:
                                    <span class="mono text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200 font-bold">${this.m01_day}</span>
                                </label>
                                <input type="range" min="1" max="7" step="1" value="${this.m01_day}" oninput="vls.setM01Day(this.value)" class="w-28 sm:w-36">
                            </div>
                            <button onclick="vls.cutM01Tip()" class="px-2.5 py-1.5 ${this.m01_isCut ? 'bg-rose-100 text-rose-700 border-rose-300' : 'bg-slate-100 text-slate-700 hover:bg-rose-50'} border rounded-xl text-xs font-bold flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-scissors text-rose-600"></i> Cut Tip B
                            </button>
                            <button onclick="vls.toggleM01Caliper()" class="px-2.5 py-1.5 ${this.m01_showCaliper ? 'bg-blue-100 text-blue-700 border-blue-300' : 'bg-slate-100 text-slate-700 hover:bg-blue-50'} border rounded-xl text-xs font-bold flex items-center gap-1 cursor-pointer">
                                <i class="fa-solid fa-ruler text-blue-600"></i> Caliper
                            </button>
                        `;
                        break;

                    case 'M02':
                        this.hudSimTag.innerText = 'Click Zone to Inspect';
                        html = `
                            <div class="flex items-center gap-1 text-xs">
                                <button onclick="vls.setM02Zone('shoot_tip')" class="px-2 py-1 rounded-lg font-bold border ${this.m02_zone === 'shoot_tip' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">Apical (Tip)</button>
                                <button onclick="vls.setM02Zone('stem_side')" class="px-2 py-1 rounded-lg font-bold border ${this.m02_zone === 'stem_side' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">Lateral (Cambium)</button>
                                <button onclick="vls.setM02Zone('nodes')" class="px-2 py-1 rounded-lg font-bold border ${this.m02_zone === 'nodes' ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200'}">Intercalary (Nodes)</button>
                            </div>
                        `;
                        break;

                    case 'M03':
                        this.hudSimTag.innerText = `Tree Age: ${this.m03_years} Years`;
                        html = `
                            <div class="flex items-center gap-2">
                                <label class="text-xs font-bold text-slate-700 flex items-center gap-1">
                                    <i class="fa-solid fa-tree text-emerald-600"></i> Age (Years):
                                    <span class="mono text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 font-bold">${this.m03_years}</span>
                                </label>
                                <input type="range" min="1" max="25" step="1" value="${this.m03_years}" oninput="vls.setM03Years(this.value)" class="w-32 sm:w-44">

            }

            // Setter functions for controls
            setM01Day(v) { this.m01_day = parseInt(v); this.renderControls(); }
            cutM01Tip() { this.m01_isCut = !this.m01_isCut; this.renderControls(); }
            toggleM01Caliper() { this.m01_showCaliper = !this.m01_showCaliper; this.renderControls(); }
            setM02Zone(z) { this.m02_zone = z; this.renderControls(); }
            setM03Years(y) { this.m03_years = parseInt(y); this.renderControls(); }
            mowM04Grass() { this.m04_mowed = true; this.m04_regrowth = 0; this.renderControls(); }
            setM04Regrowth(r) { this.m04_regrowth = parseInt(r); this.renderControls(); }
            setM05Mag(m) { this.m05_mag = m; this.renderControls(); }
            toggleM05Stain() { this.m05_stain = this.m05_stain === 'safranin' ? 'fastgreen' : 'safranin'; this.renderControls(); }
            setM06Flow(f) { this.m06_flowRate = parseInt(f); this.renderControls(); }
            setM07Turgor(t) { this.m07_turgor = parseInt(t); this.renderControls(); }
            setM08Type(t) { this.m08_type = t; this.renderControls(); }
            toggleM09Centrifuge() { this.m09_centrifuged = !this.m09_centrifuged; this.renderControls(); }
            setM10Type(t) { this.m10_type = t; this.renderControls(); }
            setM11Type(t) { this.m11_type = t; this.renderControls(); }
            triggerM12Impulse() { this.m12_impulse = 0; }
            toggleM12Myelin() { this.m12_myelinated = !this.m12_myelinated; this.renderControls(); }
            setM13Angle(a) { this.m13_angle = parseInt(a); this.renderControls(); }
            setM14Type(t) { this.m14_type = t; this.renderControls(); }
            setM14Angle(a) { this.m14_angle = parseInt(a); this.renderControls(); }
            setM15Inhale(i) { this.m15_inhale = parseInt(i); this.renderControls(); }
            setM16Tilt(t) { this.m16_tilt = parseInt(t); this.renderControls(); }
            setM17Stage(s) { this.m17_stage = parseInt(s); this.renderControls(); }
            toggleM18Infection() { this.m18_infected = !this.m18_infected; this.renderControls(); }

            // Main Animation Loop
            loop(t) {
                const w = this.canvas.clientWidth;
                const h = this.canvas.clientHeight;
                this.animTime += 0.025;

                // Auto-play progression per module
                if (this.isPlaying) {
                    if (this.currentModule === 'M01') {
                        if (Math.floor(this.animTime * 10) % 25 === 0) {
                            this.m01_day = this.m01_day < 7 ? this.m01_day + 1 : 1;
                            this.renderControls();
                        }
                    } else if (this.currentModule === 'M03') {
                        if (Math.floor(this.animTime * 10) % 20 === 0) {
                            this.m03_years = this.m03_years < 25 ? this.m03_years + 1 : 1;
                            this.renderControls();
                        }
                    } else if (this.currentModule === 'M04' && this.m04_mowed) {
                        this.m04_regrowth = Math.min(72, this.m04_regrowth + 0.5);
                        this.renderControls();
                    } else if (this.currentModule === 'M15') {
                        this.m15_inhale = Math.round(50 + Math.sin(this.animTime * 2) * 50);
                    }
                }

                this.ctx.clearRect(0, 0, w, h);

                // Apply Pan & Zoom Transform
                this.ctx.save();
                this.ctx.translate(w / 2 + this.panX, h / 2 + this.panY);
                this.ctx.scale(this.zoomLevel, this.zoomLevel);
                this.ctx.translate(-w / 2, -h / 2);

                // Render Active Experiment
                switch(this.currentModule) {
                    case 'M01': this.drawM01(w, h); break;
                    case 'M02': this.drawM02(w, h); break;
                    case 'M03': this.drawM03(w, h); break;
                    case 'M04': this.drawM04(w, h); break;
                    case 'M05': this.drawM05(w, h); break;
                    case 'M06': this.drawM06(w, h); break;
                    case 'M07': this.drawM07(w, h); break;
                    case 'M08': this.drawM08(w, h); break;
                    case 'M09': this.drawM09(w, h); break;
                    case 'M10': this.drawM10(w, h); break;
                    case 'M11': this.drawM11(w, h); break;
                    case 'M12': this.drawM12(w, h); break;
                    case 'M13': this.drawM13(w, h); break;
                    case 'M14': this.drawM14(w, h); break;
                    case 'M15': this.drawM15(w, h); break;
                    case 'M16': this.drawM16(w, h); break;
                    case 'M17': this.drawM17(w, h); break;
                    case 'M18': this.drawM18(w, h); break;
                    default: this.drawM01(w, h); break;
                }

                this.ctx.restore();

                requestAnimationFrame((timestamp) => this.loop(timestamp));
            }

            // --- ALL 18 SCIENTIFIC SIMULATION RENDERERS ---

            // M01: Onion Root Apical Meristem (Jars A & B)
            drawM01(w, h) {
                const ctx = this.ctx;
                const benchY = h * 0.78;
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(0, benchY, w, h - benchY);
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, benchY); ctx.lineTo(w, benchY); ctx.stroke();

                const jarA_x = w * 0.32;
                const jarB_x = w * 0.68;
                const jarW = Math.min(180, w * 0.3);
                const jarH = Math.min(230, h * 0.55);
                const jarY = benchY - jarH;

                const lenA = this.m01_rootA[this.m01_day - 1];
                const lenB = this.m01_isCut && this.m01_day >= 3 ? 2.1 : this.m01_rootA[this.m01_day - 1];

                this.renderOnionJar(jarA_x, jarY, jarW, jarH, 'Jar A: Control (Intact Tip)', '#2563eb', lenA, false);
                this.renderOnionJar(jarB_x, jarY, jarW, jarH, 'Jar B: Excised Tip (Day 3)', '#d97706', lenB, this.m01_isCut);
            }

            renderOnionJar(cx, cy, w, h, label, color, rootLenCm, isCut) {
                const ctx = this.ctx;
                // Jar body
                ctx.fillStyle = 'rgba(241, 245, 249, 0.8)';
                ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(cx - w * 0.45, cy + h * 0.15, w * 0.9, h * 0.85, [0, 0, 16, 16]);
                ctx.fill(); ctx.stroke();

                // Water
                const waterY = cy + h * 0.28;
                ctx.fillStyle = 'rgba(186, 230, 253, 0.45)';
                ctx.beginPath();
                ctx.roundRect(cx - w * 0.43, waterY, w * 0.86, h * 0.70, [0, 0, 14, 14]);
                ctx.fill();

                // Onion bulb
                const bulbY = cy + h * 0.18;
                const bulbR = w * 0.26;
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.ellipse(cx, bulbY, bulbR, bulbR * 0.85, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b45309'; ctx.stroke();

                // Green shoots
                ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(cx, bulbY - bulbR * 0.8);
                ctx.quadraticCurveTo(cx - 8, bulbY - bulbR * 1.4, cx - 14, bulbY - bulbR * 1.7);
                ctx.moveTo(cx + 2, bulbY - bulbR * 0.8);
                ctx.quadraticCurveTo(cx + 8, bulbY - bulbR * 1.4, cx + 16, bulbY - bulbR * 1.6);
                ctx.stroke();

                // Roots
                const rootOriginY = bulbY + bulbR * 0.72;
                const rootLenPx = rootLenCm * 25;
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.4;

                for (let r = -4; r <= 4; r++) {
                    const spread = r * (w * 0.05);
                    const endX = cx + spread * 1.3;
                    const endY = rootOriginY + rootLenPx + Math.sin(r * 2) * 4;
                    ctx.beginPath();
                    ctx.moveTo(cx + spread * 0.6, rootOriginY);
                    ctx.quadraticCurveTo(cx + spread, rootOriginY + rootLenPx * 0.5, endX, endY);
                    ctx.stroke();

                    if (!isCut || this.m01_day < 3) {
                        ctx.fillStyle = '#7c3aed';
                        ctx.beginPath(); ctx.arc(endX, endY, 3, 0, Math.PI * 2); ctx.fill();
                    } else {
                        ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.moveTo(endX - 3, endY); ctx.lineTo(endX + 3, endY); ctx.stroke();
                    }
                }

                // Caliper measurement overlay
                if (this.m01_showCaliper) {
                    ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
                    ctx.beginPath();
                    ctx.moveTo(cx - w * 0.5, rootOriginY); ctx.lineTo(cx + w * 0.5, rootOriginY);
                    ctx.moveTo(cx - w * 0.5, rootOriginY + rootLenPx); ctx.lineTo(cx + w * 0.5, rootOriginY + rootLenPx);
                    ctx.stroke(); ctx.setLineDash([]);
                }

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
                ctx.fillText(label, cx, cy - 8);
                ctx.fillStyle = color; ctx.font = 'bold 11px JetBrains Mono';
                ctx.fillText(`${rootLenCm.toFixed(1)} cm`, cx, cy + h + 22);
            }

            // M02: Meristem Locator
            drawM02(w, h) {
                const ctx = this.ctx;
                const cx1 = w * 0.35;
                const cx2 = w * 0.72;
                const cy = h * 0.52;

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText('Vegetative Shoot Growth Zones', cx1, cy - 120);

                // Stem
                ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 16;
                ctx.beginPath(); ctx.moveTo(cx1, cy + 120); ctx.lineTo(cx1, cy - 90); ctx.stroke();

                // Apical
                ctx.fillStyle = this.m02_zone === 'shoot_tip' ? '#dc2626' : '#7c3aed';
                ctx.beginPath(); ctx.arc(cx1, cy - 95, 14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 9px JetBrains Mono'; ctx.fillText('SAM', cx1, cy - 92);

                // Intercalary
                [-30, 25].forEach(ny => {
                    ctx.fillStyle = this.m02_zone === 'nodes' ? '#dc2626' : '#f59e0b';
                    ctx.fillRect(cx1 - 14, cy + ny - 6, 28, 12);
                    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.moveTo(cx1 + 10, cy + ny); ctx.quadraticCurveTo(cx1 + 45, cy + ny - 15, cx1 + 55, cy + ny - 5); ctx.stroke();
                });

                // Microscopic View of selected zone
                ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(cx2, cy, 90, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Inter';
                ctx.fillText(`Microscopic ${this.m02_zone.toUpperCase()}`, cx2, cy - 105);

                for (let i = -3; i <= 3; i++) {
                    for (let j = -3; j <= 3; j++) {
                        if (i*i + j*j <= 9) {
                            ctx.fillStyle = '#ecfdf5'; ctx.strokeStyle = '#059669'; ctx.lineWidth = 1.5;
                            ctx.fillRect(cx2 + i*22 - 10, cy + j*22 - 10, 20, 20);
                            ctx.strokeRect(cx2 + i*22 - 10, cy + j*22 - 10, 20, 20);
                            ctx.fillStyle = '#047857'; ctx.beginPath(); ctx.arc(cx2 + i*22, cy + j*22, 4, 0, Math.PI * 2); ctx.fill();
                        }
                    }
                }
            }

            // M03: Tree Rings and Annual Growth
            drawM03(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5;
                const cy = h * 0.5;
                const maxRadius = Math.min(w, h) * 0.38;

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Tree Trunk Cross-Section: ${this.m03_years} Annual Rings`, cx, cy - maxRadius - 15);

                for (let r = this.m03_years; r >= 1; r--) {
                    const radius = (r / 25) * maxRadius;
                    ctx.fillStyle = r % 2 === 0 ? '#fde68a' : '#d97706';
                    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#78350f'; ctx.lineWidth = 1.2; ctx.stroke();
                }

                // Vascular Cambium Ring
                ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 3.5;
                ctx.beginPath(); ctx.arc(cx, cy, (this.m03_years / 25) * maxRadius, 0, Math.PI * 2); ctx.stroke();

                ctx.fillStyle = '#2563eb'; ctx.font = 'bold 11px JetBrains Mono';
                ctx.fillText('Blue Ring: Lateral Meristem (Vascular Cambium)', cx, cy + maxRadius + 24);
            }

            // M04: Grass and Hedge Regrowth
            drawM04(w, h) {
                const ctx = this.ctx;
                const groundY = h * 0.72;
                ctx.fillStyle = '#78350f'; ctx.fillRect(0, groundY, w, h - groundY);

                const bladeHeight = this.m04_mowed ? (30 + this.m04_regrowth * 1.5) : 130;
                for (let x = 60; x < w - 60; x += 18) {
                    ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 4; ctx.beginPath();
                    ctx.moveTo(x, groundY); ctx.lineTo(x + Math.sin(x) * 8, groundY - bladeHeight); ctx.stroke();
                    // Intercalary node at base
                    ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(x, groundY - 12, 4, 0, Math.PI * 2); ctx.fill();
                }

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(this.m04_mowed ? `Regrowth via Intercalary Meristem: ${this.m04_regrowth} hrs` : 'Unmowed Grass Blades', w * 0.5, groundY - 150);
            }

            // M05: Plant Tissue Microscope
            drawM05(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5;
                const cy = h * 0.5;
                const r = Math.min(w, h) * 0.36;

                ctx.save();
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
                ctx.fillStyle = this.m05_stain === 'safranin' ? '#fdf2f8' : '#ecfdf5';
                ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

                // Rings
                ctx.strokeStyle = this.m05_stain === 'safranin' ? '#db2777' : '#059669'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(cx, cy, r * 0.85, 0, Math.PI * 2); ctx.stroke();

                // Vascular wedges
                for (let b = 0; b < 10; b++) {
                    const angle = (b / 10) * Math.PI * 2;
                    const bx = cx + Math.cos(angle) * (r * 0.55);
                    const by = cy + Math.sin(angle) * (r * 0.55);
                    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                // Bezel
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 14;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
            }

            // M06: Xylem and Phloem Transport
            drawM06(w, h) {
                const ctx = this.ctx;
                const cx1 = w * 0.35; const cx2 = w * 0.65; const cy = h * 0.5;
                const vH = h * 0.6; const vW = 60;

                // Xylem
                ctx.fillStyle = '#eff6ff'; ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 4;
                ctx.strokeRect(cx1 - vW * 0.5, cy - vH * 0.5, vW, vH);
                ctx.fillRect(cx1 - vW * 0.5, cy - vH * 0.5, vW, vH);
                for (let i = 0; i < 7; i++) {
                    const py = ((this.animTime * this.m06_flowRate * 25 + i * 45) % vH);
                    ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.arc(cx1, cy + vH * 0.5 - py, 6, 0, Math.PI * 2); ctx.fill();
                }

                // Phloem
                ctx.fillStyle = '#fffbeb'; ctx.strokeStyle = '#d97706'; ctx.lineWidth = 4;
                ctx.strokeRect(cx2 - vW * 0.5, cy - vH * 0.5, vW, vH);
                ctx.fillRect(cx2 - vW * 0.5, cy - vH * 0.5, vW, vH);
                for (let j = 0; j < 5; j++) {
                    const py = ((this.animTime * 60 + j * 55) % vH);
                    ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.arc(cx2, cy - vH * 0.5 + py, 6, 0, Math.PI * 2); ctx.fill();
                }

                ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center';
                ctx.fillStyle = '#1d4ed8'; ctx.fillText('Xylem (Water ↑)', cx1, cy - vH * 0.5 - 12);
                ctx.fillStyle = '#b45309'; ctx.fillText('Phloem (Sucrose ↕)', cx2, cy - vH * 0.5 - 12);
            }

            // M07: Plant Epidermal Tissue (Stomata Guard Cells)
            drawM07(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                const gap = (this.m07_turgor / 100) * 18;

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Epidermal Stomatal Apparatus: ${this.m07_turgor > 40 ? 'OPEN PORE' : 'CLOSED PORE'}`, cx, cy - 110);

                // Left guard cell
                ctx.fillStyle = '#86efac'; ctx.strokeStyle = '#15803d'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.ellipse(cx - gap - 16, cy, 22, 55, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                // Right guard cell
                ctx.beginPath(); ctx.ellipse(cx + gap + 16, cy, 22, 55, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                // Stomatal pore
                ctx.fillStyle = '#0f172a';
                ctx.beginPath(); ctx.ellipse(cx, cy, gap * 0.8, 40, 0, 0, Math.PI * 2); ctx.fill();
            }

            // M08: Epithelial Tissue
            drawM08(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Epithelial Tissue: ${this.m08_type.toUpperCase()}`, cx, cy - 90);

                ctx.strokeStyle = '#475569'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(cx - 160, cy + 40); ctx.lineTo(cx + 160, cy + 40); ctx.stroke();

                for (let i = -3; i <= 3; i++) {
                    const x = cx + i * 40 - 20;
                    ctx.fillStyle = '#ecfdf5'; ctx.strokeStyle = '#059669'; ctx.lineWidth = 2;
                    ctx.fillRect(x, cy - 40, 38, 80); ctx.strokeRect(x, cy - 40, 38, 80);
                    ctx.fillStyle = '#047857'; ctx.beginPath(); ctx.arc(x + 19, cy + 10, 6, 0, Math.PI * 2); ctx.fill();
                }
            }

            // M09: Blood Components
            drawM09(w, h) {
                const ctx = this.ctx;
                const cy = h * 0.5;
                if (!this.m09_centrifuged) {
                    ctx.fillStyle = '#fff1f2'; ctx.fillRect(0, cy - 60, w, 120);
                    for (let i = 0; i < 16; i++) {
                        const rx = ((this.animTime * 140 + i * 65) % (w + 40)) - 20;
                        ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.ellipse(rx, cy + Math.sin(i + this.animTime)*25, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
                    }
                } else {
                    ctx.fillStyle = '#fef08a'; ctx.fillRect(w * 0.4, cy - 100, w * 0.2, 90); // Plasma 55%
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(w * 0.4, cy - 10, w * 0.2, 10);  // Buffy coat 1%
                    ctx.fillStyle = '#dc2626'; ctx.fillRect(w * 0.4, cy, w * 0.2, 100);     // RBCs 45%
                }
            }

            // M10: Connective Tissue
            drawM10(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Connective Tissue: ${this.m10_type.toUpperCase()}`, cx, cy - 100);

                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
                ctx.strokeRect(cx - 150, cy - 80, 300, 160);
                for (let i = 0; i < 15; i++) {
                    ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(cx - 120 + (i*22)%280, cy - 60 + (i*35)%130, 8, 0, Math.PI * 2); ctx.fill();
                }
            }

            // M11: Muscle Tissue Comparison
            drawM11(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                const pulse = Math.sin(this.animTime * 6) * 5;

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Muscle Fiber: ${this.m11_type.toUpperCase()}`, cx, cy - 80);

                ctx.fillStyle = '#fee2e2'; ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 3;
                ctx.fillRect(cx - 160, cy - 25 - pulse * 0.5, 320, 50 + pulse);
                ctx.strokeRect(cx - 160, cy - 25 - pulse * 0.5, 320, 50 + pulse);

                for (let s = -150; s < 150; s += 10) {
                    ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(cx + s, cy - 25 - pulse * 0.5); ctx.lineTo(cx + s, cy + 25 + pulse * 0.5); ctx.stroke();
                }
            }

            // M12: Neuron and Signal Pathway
            drawM12(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.35; const cy = h * 0.5;
                const axonEnd = w * 0.8;

                ctx.fillStyle = '#38bdf8'; ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.strokeStyle = '#64748b'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.moveTo(cx + 30, cy); ctx.lineTo(axonEnd, cy); ctx.stroke();

                if (this.m12_impulse >= 0 && this.m12_impulse <= axonEnd) {
                    ctx.fillStyle = '#ec4899'; ctx.beginPath(); ctx.arc(cx + 30 + this.m12_impulse, cy, 9, 0, Math.PI * 2); ctx.fill();
                    this.m12_impulse += 8;
                }
            }

            // M13: Muscle-Tendon-Bone Movement (Elbow Lever)
            drawM13(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.45; const cy = h * 0.65;
                const rad = (this.m13_angle * Math.PI) / 180;

                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 18;
                ctx.beginPath(); ctx.moveTo(cx - 90, cy - 110); ctx.lineTo(cx, cy); ctx.stroke();

                const fx = cx + Math.cos(-rad) * 120;
                const fy = cy + Math.sin(-rad) * 120;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(fx, fy); ctx.stroke();

                // Biceps
                ctx.fillStyle = '#ef4444'; ctx.beginPath();
                ctx.ellipse(cx - 40, cy - 55, this.m13_angle < 90 ? 25 : 15, 45, -0.6, 0, Math.PI * 2); ctx.fill();
            }

            // M14: Joint Movement Lab
            drawM14(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Joint: ${this.m14_type.toUpperCase()}`, cx, cy - 90);

                ctx.strokeStyle = '#475569'; ctx.lineWidth = 10;
                ctx.beginPath(); ctx.arc(cx, cy, 40, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
                ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(cx + 10, cy, 28, 0, Math.PI * 2); ctx.fill();
            }

            // M15: Skeleton and Breathing
            drawM15(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                const expand = (this.m15_inhale / 100) * 18;

                ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px Inter'; ctx.textAlign = 'center';
                ctx.fillText(`Thorax Expansion: ${this.m15_inhale}%`, cx, cy - 90);

                for (let r = 0; r < 5; r++) {
                    ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.ellipse(cx, cy - 40 + r * 16, 35 + expand, 8, 0, 0, Math.PI); ctx.stroke();
                }
            }

            // M16: Body Weight and Movement
            drawM16(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.65;
                const rad = (this.m16_tilt * Math.PI) / 180;

                ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 8;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(rad)*110, cy - Math.cos(rad)*110); ctx.stroke();
            }

            // M17: Carrot Tissue Culture
            drawM17(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                // Test tube
                ctx.fillStyle = 'rgba(254, 243, 199, 0.4)'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.roundRect(cx - 35, cy - 90, 70, 180, [0, 0, 35, 35]); ctx.fill(); ctx.stroke();

                // Callus clump
                ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(cx, cy + 45, this.m17_stage * 9, 0, Math.PI * 2); ctx.fill();
            }

            // M18: Crown Gall Experiment
            drawM18(w, h) {
                const ctx = this.ctx;
                const cx = w * 0.5; const cy = h * 0.5;
                ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 20;
                ctx.beginPath(); ctx.moveTo(cx, cy + 90); ctx.lineTo(cx, cy - 90); ctx.stroke();

                if (this.m18_infected) {
                    ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(cx + 8, cy, 26, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        window.onload = () => {
            window.vls = new VirtualLabSimulator();
        };
    </script>
